
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Answers</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --green-light: #68d0a0;
      --text: #ffffff;
      --muted: #c3d5cc;
      --card: rgba(8, 32, 25, 0.38);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "DM Sans", sans-serif;
      color: var(--text);

      background:
        linear-gradient(
          rgba(8, 29, 25, 0.42),
          rgba(8, 29, 25, 0.58)
        ),
        url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=2400&q=85");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      position: relative;
      overflow-x: hidden;
    }

    /* Dark atmosphere overlay */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(5, 23, 19, 0.20),
          transparent 45%,
          rgba(5, 23, 19, 0.42)
        );

      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: min(100% - 48px, 1180px);
      margin: auto;
    }

    /* =====================================================
       LIVE NATURE BACKGROUND
       ===================================================== */

    .nature-effects {
      position: fixed;
      inset: 0;

      overflow: hidden;
      pointer-events: none;

      z-index: 1;
    }

    .cloud {
      position: absolute;

      width: 280px;
      height: 78px;

      border-radius: 100px;

      background: rgba(255, 255, 255, 0.12);

      filter: blur(9px);
      opacity: 0.45;
    }

    .cloud::before,
    .cloud::after {
      content: "";

      position: absolute;
      bottom: 12px;

      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      left: 45px;

      width: 125px;
      height: 125px;
    }

    .cloud::after {
      right: 40px;

      width: 95px;
      height: 95px;
    }

    .cloud-1 {
      top: 12%;
      left: -350px;

      animation: cloudMove1 85s linear infinite;
    }

    .cloud-2 {
      top: 24%;
      left: -450px;

      transform: scale(0.75);
      opacity: 0.30;

      animation: cloudMove2 110s linear infinite;
    }

    .cloud-3 {
      top: 7%;
      left: -500px;

      transform: scale(1.2);
      opacity: 0.20;

      animation: cloudMove3 135s linear infinite;
    }

    @keyframes cloudMove1 {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(calc(100vw + 800px));
      }
    }

    @keyframes cloudMove2 {
      from {
        transform: translateX(0) scale(0.75);
      }

      to {
        transform: translateX(calc(100vw + 900px)) scale(0.75);
      }
    }

    @keyframes cloudMove3 {
      from {
        transform: translateX(0) scale(1.2);
      }

      to {
        transform: translateX(calc(100vw + 1000px)) scale(1.2);
      }
    }

    /* Falling leaves */

    .leaves {
      position: absolute;
      inset: 0;
    }

    .leaf {
      position: absolute;
      top: -30px;

      width: 9px;
      height: 13px;

      border-radius: 80% 0 80% 0;

      background: rgba(183, 215, 137, 0.78);

      opacity: 0;

      animation: leafFall linear infinite;
    }

    @keyframes leafFall {
      0% {
        transform:
          translate3d(0, -30px, 0)
          rotate(0deg);

        opacity: 0;
      }

      10% {
        opacity: 0.75;
      }

      30% {
        transform:
          translate3d(55px, 30vh, 0)
          rotate(100deg);
      }

      55% {
        transform:
          translate3d(-45px, 55vh, 0)
          rotate(210deg);
      }

      78% {
        transform:
          translate3d(70px, 78vh, 0)
          rotate(300deg);
      }

      100% {
        transform:
          translate3d(-20px, 110vh, 0)
          rotate(390deg);

        opacity: 0;
      }
    }

    /* Gentle sunlight movement */

    .sunlight {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 80% 25%,
          rgba(255, 220, 157, 0.12),
          transparent 30%
        );

      animation: sunlightMove 20s ease-in-out infinite alternate;
    }

    @keyframes sunlightMove {
      from {
        opacity: 0.35;
      }

      to {
        opacity: 0.90;
      }
    }


    /* =====================================================
       MAIN
       ===================================================== */

    main {
      position: relative;
      z-index: 2;

      padding: 60px 0 90px;
    }

    .hero {
      max-width: 720px;
      margin: 0 auto 42px;

      text-align: center;
    }

    .eyebrow {
      margin-bottom: 17px;

      color: #c4e4d3;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;

      font-size: clamp(35px, 5vw, 58px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -2px;
    }

    .hero h1 span {
      color: var(--green-light);
    }

    .hero p {
      max-width: 500px;
      margin: 21px auto 0;

      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    /* =====================================================
       FORM CARD
       ===================================================== */

    .form-card {
      width: min(100%, 960px);
      margin: auto;
      padding: 38px 44px 32px;

      border: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 19px;

      /* Change 0.38 to adjust transparency */
      background: var(--card);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      /* No blur */
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 15px;

      margin-bottom: 32px;
    }

    .heading-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;

      display: grid;
      place-items: center;

      border: 1px solid rgba(166, 235, 198, 0.48);
      border-radius: 50%;

      background: rgba(130, 218, 170, 0.13);
      color: #a6eac5;

      font-size: 20px;
    }

    .card-heading-content {
      flex: 1;
    }

    .card-heading h2 {
      margin: 0 0 5px;

      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .card-heading p {
      margin: 0;

      color: #b8cec2;
      font-size: 12px;
    }

    /* Small clear icon */

    .clear-icon {
      width: 38px;
      height: 38px;
      flex-shrink: 0;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 9px;

      background: rgba(255, 255, 255, 0.04);
      color: #d5e4dc;

      font-size: 17px;
      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .clear-icon:hover {
      border-color: rgba(255, 170, 170, 0.6);
      background: rgba(160, 60, 60, 0.22);
      color: #ffc0c0;
    }

    .clear-icon:focus-visible {
      outline: 2px solid var(--green-light);
      outline-offset: 3px;
    }

    /* =====================================================
       INPUT FIELDS
       ===================================================== */

    .field {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;

      color: #f0f6f2;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 58px;
      padding: 0 18px;

      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 11px;
      outline: none;

      background: rgba(5, 26, 21, 0.34);
      color: white;

      font-family: inherit;
      font-size: 14px;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #b2c7bb;
    }

    input:focus {
      border-color: #8bdab1;
      background: rgba(5, 26, 21, 0.52);

      box-shadow:
        0 0 0 3px rgba(139, 218, 177, 0.10);
    }

    /* =====================================================
       SUBMIT BUTTON
       ===================================================== */

    .primary-button {
      width: 100%;
      height: 56px;

      border: 1px solid rgba(193, 255, 218, 0.35);
      border-radius: 11px;

      background: var(--green-light);
      color: #09271b;

      font-family: inherit;
      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .primary-button:hover {
      background: #80dfb1;
      transform: translateY(-1px);
    }

    .primary-button:active {
      transform: translateY(0);
    }

    /* =====================================================
       HELPER AND RESULT
       ===================================================== */

    .helper-text {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      margin: 23px 0 0;

      color: #b5c9be;
      font-size: 11px;
      text-align: center;
    }

    .privacy-icon {
      font-size: 14px;
    }

    #result {
      display: none;

      margin-top: 24px;
      padding: 18px;

      border: 1px solid rgba(151, 240, 190, 0.35);
      border-radius: 11px;

      background: rgba(43, 125, 84, 0.30);
      color: #b8f5d1;

      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;

      animation: showResult 0.25s ease;
    }

    #result.error {
      border-color: rgba(255, 160, 160, 0.4);
      background: rgba(125, 43, 43, 0.32);
      color: #ffd0d0;
    }

    @keyframes showResult {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    
    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {
      .container {
        width: min(100% - 30px, 1180px);
      }

      header {
        height: 66px;
      }

      main {
        padding: 45px 0 60px;
      }

      .hero {
        margin-bottom: 30px;
      }

      .hero h1 {
        font-size: 37px;
        letter-spacing: -1.2px;
      }

      .hero p {
        font-size: 13px;
      }

      .form-card {
        padding: 25px 20px 24px;
        border-radius: 15px;
      }

      .card-heading {
        gap: 11px;
      }

      .card-heading h2 {
        font-size: 17px;
      }

      .card-heading p {
        font-size: 11px;
      }

      .heading-icon {
        width: 42px;
        height: 42px;
      }

      .clear-icon {
        width: 35px;
        height: 35px;
      }

      .header-right {
        gap: 15px;
      }

      .menu-button {
        padding-left: 14px;
      }
    }

    /* Respect users who prefer reduced motion */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Live background effects -->

  <div class="nature-effects">

    <div class="sunlight"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="leaves"></div>

  </div>


  <!-- Main -->

  <main>
    <div class="container">

      <section class="hero">

        <div class="eyebrow">
          The Private Oracle
        </div>

        <h1>
          Ask your <span>question.</span>
        </h1>

        <p>
          Submit your petition and question to receive
          your answer in a simple, private experience.
        </p>

      </section>

      <!-- Form -->

      <section class="form-card">

        <div class="card-heading">

          <div class="heading-icon">
            ✦
          </div>

          <div class="card-heading-content">

            <h2>
              Submit a question
            </h2>

            <p>
              Complete both fields below to continue.
            </p>

          </div>

          <button
            class="clear-icon"
            id="clearBtn"
            title="Clear fields"
            aria-label="Clear fields"
          >
            ♲
          </button>

        </div>

        <!-- Petition -->

        <div class="field">

          <label for="petition">
            Petition
          </label>

          <input
            type="text"
            id="petition"
            placeholder="Enter your petition..."
            autocomplete="off"
          >

        </div>

        <!-- Question -->

        <div class="field">

          <label for="question">
            Question
          </label>

          <input
            type="text"
            id="question"
            placeholder="What would you like to ask?"
            autocomplete="off"
          >

        </div>

        <!-- Submit -->

        <button
          class="primary-button"
          id="sendBtn"
        >
          Submit Question&nbsp; →
        </button>

        <div class="helper-text">

          <span class="privacy-icon">♢</span>

          Your question is kept private in this session.

        </div>

        <div id="result"></div>

      </section>

    </div>
  </main>


  <script>
    /* =====================================================
       CREATE FALLING LEAVES
       ===================================================== */

    const leavesContainer =
      document.querySelector(".leaves");

    for (let i = 0; i < 30; i++) {

      const leaf = document.createElement("div");

      leaf.className = "leaf";

      const size = 6 + Math.random() * 7;

      leaf.style.left =
        Math.random() * 100 + "%";

      leaf.style.width =
        size + "px";

      leaf.style.height =
        size * 1.35 + "px";

      const duration =
        8 + Math.random() * 10;

      leaf.style.animationDuration =
        duration + "s";

      leaf.style.animationDelay =
        -(Math.random() * duration) + "s";

      leavesContainer.appendChild(leaf);

    }


    /* =====================================================
       SECRET TYPING FUNCTIONALITY
       ===================================================== */

    const MASK_TEXT = "Chander please answer";

    let isTricked = false;
    let hiddenAnswer = "";
    let maskIndex = 0;

    const petitionInput =
      document.getElementById("petition");

    const questionInput =
      document.getElementById("question");

    const sendBtn =
      document.getElementById("sendBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const resultDiv =
      document.getElementById("result");


    petitionInput.addEventListener("keydown", (e) => {

      const controlKeys = [
        "Tab",
        "Shift",
        "Control",
        "Alt",
        "Escape",
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        "ArrowDown",
        "Home",
        "End"
      ];

      if (controlKeys.includes(e.key)) {
        return;
      }

      /* Activate or deactivate secret mode */

      if (e.key === ".") {

        e.preventDefault();

        isTricked = !isTricked;

        if (maskIndex < MASK_TEXT.length) {

          petitionInput.value +=
            MASK_TEXT[maskIndex];

          maskIndex++;

        }

        return;
      }

      /* Backspace in secret mode */

      if (e.key === "Backspace") {

        if (isTricked && hiddenAnswer.length > 0) {

          e.preventDefault();

          hiddenAnswer =
            hiddenAnswer.slice(0, -1);

          petitionInput.value =
            petitionInput.value.slice(0, -1);

          maskIndex =
            Math.max(0, maskIndex - 1);

        }

        return;
      }

      /* Capture hidden answer */

      if (isTricked && e.key.length === 1) {

        e.preventDefault();

        hiddenAnswer += e.key;

        if (maskIndex < MASK_TEXT.length) {

          petitionInput.value +=
            MASK_TEXT[maskIndex];

          maskIndex++;

        }

      }

    });


    /* =====================================================
       RESULT FUNCTIONS
       ===================================================== */

    function showResult(message, isError = false) {

      resultDiv.textContent = message;

      resultDiv.classList.toggle(
        "error",
        isError
      );

      resultDiv.style.display = "block";

    }


    function resetState() {

      hiddenAnswer = "";
      isTricked = false;
      maskIndex = 0;

      petitionInput.value = "";
      questionInput.value = "";

    }


    function clearSession() {

      resetState();

      resultDiv.textContent = "";
      resultDiv.style.display = "none";

      resultDiv.classList.remove("error");

      petitionInput.focus();

    }


    /* =====================================================
       SUBMIT QUESTION
       ===================================================== */

    sendBtn.addEventListener("click", () => {

      if (!questionInput.value.trim()) {

        showResult(
          "Please enter a question first.",
          true
        );

        questionInput.focus();

        return;

      }

      if (hiddenAnswer.trim()) {

        showResult(hiddenAnswer);

      } else {

        showResult(
          "You do not possess enough faith for Peter to answer."
        );

      }

      resetState();

    });


    /* Clear button */

    clearBtn.addEventListener(
      "click",
      clearSession
    );


    /* Enter key submits the question */

    questionInput.addEventListener(
      "keydown",
      (e) => {

        if (e.key === "Enter") {
          sendBtn.click();
        }

      }
    );

  </script>

</body>
</html>
